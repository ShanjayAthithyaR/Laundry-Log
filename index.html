<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laundry Keeper</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--text:#1c1917;--mute:#78716c;--line:#e7e5e4;--acc:#2563eb;--accT:#fff;--warn:#d97706;--ok:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1b19;--text:#f5f5f4;--mute:#a8a29e;--line:#2e2c29;--acc:#60a5fa;--accT:#0b1220;--warn:#fbbf24;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1b19;--text:#f5f5f4;--mute:#a8a29e;--line:#2e2c29;--acc:#60a5fa;--accT:#0b1220;--warn:#fbbf24;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;text-align:left;font:inherit;color:var(--text);cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat.on{border-color:var(--acc)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.brk .r{display:flex;justify-content:space-between;padding:5px 0;text-transform:capitalize}
.brk .r b{font-weight:600}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:700px){.two-col{grid-template-columns:1fr}}

.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px}
.dg>div{display:flex;align-items:center;justify-content:space-between;text-transform:capitalize}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:28px;height:28px;font-size:16px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;line-height:1}
.stp b{min-width:18px;text-align:center}
.solo{width:100%;border:1px dashed var(--acc);background:none;color:var(--acc);padding:11px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.ask{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.ask span{flex:1}
.ask button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
.ask button[data-a="y"]{background:var(--acc);border-color:var(--acc);color:var(--accT)}
.go{width:100%;border:0;background:var(--acc);color:var(--accT);padding:12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.pl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-of-type{border-bottom:0}
.pv{text-align:right;white-space:nowrap}
.pv b{font-size:18px}
small,.mute{color:var(--mute);font-size:12px}
small.w{color:var(--warn)}
.grp{padding:10px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.gh b{font-weight:600}
.ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0;text-transform:capitalize}
.rcv{border:1px solid var(--ok);color:var(--ok);background:none;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.rcv:hover{background:var(--ok);color:#fff}
.rcv-block{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.hist{display:flex;justify-content:space-between;align-items:center;margin:22px 0 8px}
.hist h2{margin:0}
.hist button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.st{font-size:12px;font-weight:600}
.st.p{color:var(--warn)}.st.d{color:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:12px 0}
details.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
details.tot summary{cursor:pointer;color:var(--mute);font-size:13px}
.trow{display:flex;align-items:center;justify-content:space-between;padding:6px 0;text-transform:capitalize}
.trow input{width:80px;text-align:center;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:5px}
</style>
</head>
<body>
<main>
<h1>Laundry Keeper</h1>
<div class="sub">Log daily dirty clothes, put for wash, and track returns.</div>

<div class="stats">
  <button class="stat" data-s="out"><b id="sOut">0</b><span>In laundry now</span></button>
  <button class="stat" data-s="ward"><b id="sWard">0</b><span>Left in wardrobe</span></button>
  <button class="stat" data-s="all"><b id="sAll">0</b><span>Total items owned</span></button>
</div>
<div class="card brk" id="brk" hidden></div>

<!-- Main 2-Column Section: Left (Dress) and Right (Inners) -->
<div class="two-col">
  <!-- LEFT: DIRTY DRESS & PUT FOR LAUNDRY -->
  <div>
    <div class="card" id="dirtyDressCard"></div>
    <div class="card" id="putDressCard"></div>
  </div>

  <!-- RIGHT: DIRTY INNERS & PUT FOR LAUNDRY -->
  <div>
    <div class="card" id="dirtyInnersCard"></div>
    <div class="card" id="putInnersCard"></div>
  </div>
</div>

<!-- In Laundry Pending Status -->
<div class="card">
  <h2>In Laundry (Pending Return)</h2>
  <div id="pend"></div>
</div>

<div class="hist"><h2>History</h2><button id="clr">Clear</button></div>
<div class="card" id="hist"></div>

<details class="tot"><summary>Set how many of each item I own</summary><div id="totBody"></div></details>
<details class="tot"><summary>Daily usage rate (items needed per day)</summary><div id="cfgBody"></div></details>
</main>

<script>
const GROUPS={
  dress:["shirt","pant","jeans","tshirt","bermuda","bedsheet","pillow cover"],
  inners:["baniyan","underwear","socks"]
};
const DAILY_RATE={shirt:1,pant:0.6,jeans:0.4,tshirt:0.6,bermuda:0.4,bedsheet:0.2,"pillow cover":0.2,baniyan:1,underwear:1,socks:1};
const $=id=>document.getElementById(id);

let S={records:[],totals:{},dirty:{},dirtyAt:0,cfg:{lastPutTime:null,rate:{}}},open="",asking=false;
const fmt=t=>new Date(t).toLocaleString([], {day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const tm=t=>new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const dayF=t=>new Date(t).toLocaleDateString([], {day:"numeric",month:"short",year:"numeric"});

function load(){
  try{const r=localStorage.getItem("laundry-v6");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
  S.records=S.records||[];S.totals=S.totals||{};S.dirty=S.dirty||{};
  S.cfg=Object.assign({lastPutTime:null,rate:{}},S.cfg||{});
  S.cfg.rate=S.cfg.rate||{};
  if(!S.cfg.lastPutTime){
    const dRecs=S.records.filter(r=>r.type=="dress");
    if(dRecs.length)S.cfg.lastPutTime=Math.max(...dRecs.map(r=>r.putAt));
  }
}
function save(){try{localStorage.setItem("laundry-v6",JSON.stringify(S))}catch(e){}}

function getDailyRate(i){return S.cfg.rate[i]!=null?S.cfg.rate[i]:(DAILY_RATE[i]||0.5)}

// Computes the cycle interval automatically: (now - previous laundry put date) in days
function getElapsedDays(){
  if(!S.cfg.lastPutTime)return 4; // default buffer if no previous laundry recorded
  const now=Date.now(),ms=now-S.cfg.lastPutTime;
  const days=Math.round(ms/(1000*60*60*24));
  return Math.max(1,days);
}

function buildTotals(){
  $("totBody").innerHTML=Object.entries(GROUPS).map(([g,items])=>`<h2>${g}</h2>`+items.map(i=>`<div class="trow"><span>${i}</span><input type="number" min="0" value="${S.totals[i]||0}" data-t="${i}"></div>`).join("")).join("");
}
function buildCfg(){
  $("cfgBody").innerHTML=Object.entries(GROUPS).map(([g,items])=>`<h2>${g}</h2>`+items.map(i=>`<div class="trow"><span>${i} / day</span><input type="number" step="0.1" min="0" value="${getDailyRate(i)}" data-r="${i}"></div>`).join("")).join("");
}
function group(recs){
  const m=new Map();
  recs.forEach(r=>{const k=r.type+"|"+new Date(r.putAt).toDateString();if(!m.has(k))m.set(k,{type:r.type,day:r.putAt,recs:[]});m.get(k).recs.push(r)});
  return [...m.values()];
}
function outMap(){const o={};S.records.filter(r=>!r.recvAt).forEach(r=>o[r.item]=(o[r.item]||0)+r.n);return o}

function planGroup(grpKey){
  const o=outMap();
  const cycleDays=getElapsedDays();
  return GROUPS[grpKey].map(i=>{
    const own=S.totals[i]||0,L=o[i]||0,D=S.dirty[i]||0,C=Math.max(0,own-L-D);
    if(grpKey=="inners"){
      // No keep count for inners: all dirty clothes are put for laundry
      return {i,own,L,D,C,N:0,short:0,keep:0,put:D};
    }
    // Dress: keep buffer is calculated based on the days elapsed since the last laundry put date
    const N=Math.ceil(getDailyRate(i)*cycleDays);
    const short=Math.max(0,N-C);
    const keep=Math.min(D,short);
    const put=Math.max(0,D-keep);
    return {i,own,L,D,C,N,short,keep,put};
  });
}

function render(){
  const outBy=outMap(),own=i=>S.totals[i]||0,out=i=>outBy[i]||0,ward=i=>Math.max(0,own(i)-out(i));
  const all=Object.values(GROUPS).flat(),sum=f=>all.reduce((a,i)=>a+f(i),0);
  $("sOut").textContent=sum(out);$("sWard").textContent=sum(ward);$("sAll").textContent=sum(own);

  document.querySelectorAll(".stat").forEach(b=>b.classList.toggle("on",b.dataset.s==open));
  const B=$("brk");B.hidden=!open;
  if(open){
    const f={out,ward,all:own}[open],t={out:"In laundry now",ward:"Left in wardrobe",all:"Total items owned"}[open];
    B.innerHTML=`<h2>${t}, by category</h2>`+Object.entries(GROUPS).map(([g,items])=>`<div class="mute" style="margin-top:8px;text-transform:uppercase;letter-spacing:.06em">${g} · ${items.reduce((a,i)=>a+f(i),0)}</div>`+items.map(i=>`<div class="r"><span>${i}</span><b>${f(i)}</b></div>`).join("")).join("");
  }

  // 1. LEFT - DIRTY DRESS
  $("dirtyDressCard").innerHTML=`<h2>Dirty Dress · Daily Entry</h2><button class="solo" id="soloShirt">+ 1 Shirt</button>`+
    (asking?`<div class="ask"><span>Shirt added. Add a pant too?</span><button data-a="y">Yes</button><button data-a="n">No</button></div>`:"")+
    `<div class="dg">${GROUPS.dress.map(i=>`<div><span>${i}</span><span class="stp"><button data-di="${i}" data-d="-1">−</button><b>${S.dirty[i]||0}</b><button data-di="${i}" data-d="1">+</button></span></div>`).join("")}</div>`;

  // 2. LEFT - PUT FOR LAUNDRY (DRESS)
  const pDress=planGroup("dress"),dRows=pDress.filter(p=>p.D>0||(p.own>0&&p.short>0)),totPutDress=pDress.reduce((a,p)=>a+p.put,0);
  const outDressRecs=S.records.filter(r=>!r.recvAt&&r.type=="dress");
  const outDressCount=outDressRecs.reduce((a,r)=>a+r.n,0);

  $("putDressCard").innerHTML=`<h2>Put for Laundry · Dress</h2>`+
    (dRows.length?dRows.map(p=>`<div class="pl"><div><b style="text-transform:capitalize;font-weight:600">${p.i}</b><br><small>${p.own} owned · ${p.D} dirty · clean buffer ${p.N}</small></div><div class="pv"><b>${p.put}</b><small> put</small>${p.keep?`<br><small class="w">keep ${p.keep}</small>`:""}</div></div>`).join("")+(totPutDress?`<button class="go" id="logPutDress">Put ${totPutDress} dress for laundry</button>`:""):`<div class="empty">No dirty dress to put</div>`)+
    (outDressCount?`<div class="rcv-block"><div><b>${outDressCount} dress in laundry</b></div><button class="rcv" data-rcv-type="dress">Received All</button></div>`:"");

  // 3. RIGHT - DIRTY INNERS
  $("dirtyInnersCard").innerHTML=`<h2>Dirty Inners · Daily Entry</h2><button class="solo" id="soloInner">+ 1 Inners Set (Baniyan + Underwear)</button>`+
    `<div class="dg">${GROUPS.inners.map(i=>`<div><span>${i}</span><span class="stp"><button data-di="${i}" data-d="-1">−</button><b>${S.dirty[i]||0}</b><button data-di="${i}" data-d="1">+</button></span></div>`).join("")}</div>`;

  // 4. RIGHT - PUT FOR LAUNDRY (INNERS) - NO KEEP
  const pInners=planGroup("inners"),iRows=pInners.filter(p=>p.D>0),totPutInners=pInners.reduce((a,p)=>a+p.put,0);
  const outInnersRecs=S.records.filter(r=>!r.recvAt&&r.type=="inners");
  const outInnersCount=outInnersRecs.reduce((a,r)=>a+r.n,0);

  $("putInnersCard").innerHTML=`<h2>Put for Laundry · Inners</h2>`+
    (iRows.length?iRows.map(p=>`<div class="pl"><div><b style="text-transform:capitalize;font-weight:600">${p.i}</b><br><small>${p.own} owned · ${p.D} dirty</small></div><div class="pv"><b>${p.put}</b><small> put to wash</small></div></div>`).join("")+(totPutInners?`<button class="go" id="logPutInners">Put all ${totPutInners} inners for laundry</button>`:""):`<div class="empty">No dirty inners to put</div>`)+
    (outInnersCount?`<div class="rcv-block"><div><b>${outInnersCount} inners in laundry</b></div><button class="rcv" data-rcv-type="inners">Received All</button></div>`:"");

  // PENDING LIST
  const pend=S.records.filter(r=>!r.recvAt).slice().reverse();
  $("pend").innerHTML=pend.length?group(pend).map(g=>`<div class="grp"><div class="gh"><b>${g.type=="inners"?"Inners":"Dress"} · ${dayF(g.day)}</b><button class="rcv" data-ids="${g.recs.map(r=>r.id).join(",")}">Received</button></div>${g.recs.map(r=>`<div class="ln"><span>${r.n} × ${r.item}</span><small>${tm(r.putAt)}</small></div>`).join("")}</div>`).join(""):`<div class="empty">Nothing pending in laundry</div>`;

  // HISTORY
  const L=S.records.slice().reverse();
  $("hist").innerHTML=L.length?group(L).map(g=>{
    const d=g.recs.filter(r=>r.recvAt).length,st=d==g.recs.length?["d","All received"]:d?["p","Partly received"]:["p","In laundry"];
    return `<div class="grp"><div class="gh"><b>${g.type=="inners"?"Inners":"Dress"} · Laundry ${dayF(g.day)}</b><span class="st ${st[0]}">${st[1]}</span></div>${g.recs.map(r=>`<div class="ln"><span>${r.n} × ${r.item}</span><small>put ${tm(r.putAt)}${r.recvAt?" · received "+fmt(r.recvAt):""}</small></div>`).join("")}</div>`}).join(""):`<div class="empty">No entries yet</div>`;
}

const rid=()=>Date.now()+Math.random().toString(36).slice(2,6);

// Handle dirty dress adjustments
$("dirtyDressCard").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const add=(i,n)=>{S.dirty[i]=Math.max(0,(S.dirty[i]||0)+n);S.dirtyAt=Date.now()};
  if(b.id=="soloShirt"){add("shirt",1);asking=true}
  else if(b.dataset.a){if(b.dataset.a=="y")add("pant",1);asking=false}
  else if(b.dataset.di)add(b.dataset.di,+b.dataset.d);
  else return;
  save();render();
};

// Handle dirty inners adjustments
$("dirtyInnersCard").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const add=(i,n)=>{S.dirty[i]=Math.max(0,(S.dirty[i]||0)+n);S.dirtyAt=Date.now()};
  if(b.id=="soloInner"){add("baniyan",1);add("underwear",1)}
  else if(b.dataset.di)add(b.dataset.di,+b.dataset.d);
  else return;
  save();render();
};

// Put dress for laundry: sets current timestamp as the new laundry milestone
$("putDressCard").onclick=e=>{
  const rcvBtn=e.target.closest("[data-rcv-type]");
  if(rcvBtn){
    const now=Date.now();
    S.records.forEach(r=>{if(!r.recvAt&&r.type=="dress")r.recvAt=now});
    save();render();
    return;
  }
  if(!e.target.closest("#logPutDress"))return;
  const now=Date.now();
  planGroup("dress").filter(p=>p.put>0).forEach(p=>{
    S.records.push({id:rid(),type:"dress",item:p.i,n:p.put,putAt:now,recvAt:null});
    S.dirty[p.i]=p.keep;
  });
  S.cfg.lastPutTime=now; // Automatically record current time as the last laundry put date
  S.dirtyAt=now;
  save();render();
};

// Put inners for laundry (no keep: dirty count clears completely)
$("putInnersCard").onclick=e=>{
  const rcvBtn=e.target.closest("[data-rcv-type]");
  if(rcvBtn){
    const now=Date.now();
    S.records.forEach(r=>{if(!r.recvAt&&r.type=="inners")r.recvAt=now});
    save();render();
    return;
  }
  if(!e.target.closest("#logPutInners"))return;
  const now=Date.now();
  planGroup("inners").filter(p=>p.put>0).forEach(p=>{
    S.records.push({id:rid(),type:"inners",item:p.i,n:p.put,putAt:now,recvAt:null});
    S.dirty[p.i]=0;
  });
  S.dirtyAt=now;
  save();render();
};

document.querySelector(".stats").onclick=e=>{const b=e.target.closest("[data-s]");if(b){open=open==b.dataset.s?"":b.dataset.s;render()}};

$("pend").onclick=e=>{
  const b=e.target.closest("[data-ids]");if(!b)return;
  const ids=b.dataset.ids.split(",");
  const now=Date.now();
  S.records.forEach(r=>{if(ids.includes(r.id))r.recvAt=now});
  save();render();
};

$("totBody").onchange=e=>{
  const i=e.target.dataset.t;if(!i)return;
  S.totals[i]=Math.max(0,Math.floor(+e.target.value)||0);
  e.target.value=S.totals[i];
  save();render();
};

$("cfgBody").onchange=e=>{
  const r=e.target.dataset.r;if(!r)return;
  S.cfg.rate[r]=Math.max(0,parseFloat(e.target.value)||0);
  save();render();
};

$("clr").onclick=()=>{if(confirm("Clear all history?")){S.records=[];S.cfg.lastPutTime=null;save();render()}};

load();buildTotals();buildCfg();render();
</script>
</body>
</html>
